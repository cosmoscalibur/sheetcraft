[workspace]
members = ["sheetrs", "sheetlint", "sheetstats", "sheetcli", "sheetrs-wasm"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Edward Villegas <cosmoscalibur@gmail.com>"]
license = "MIT"
repository = "https://github.com/cosmoscalibur/sheetrs"


[workspace.dependencies]
# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.6", features = ["derive", "cargo"] }

# Colored output
colored = "3.1"

# XML parsing
quick-xml = "0.39"
zip = { version = "8.3", default-features = false, features = ["deflate"] }

# HTTP client for link validation
reqwest = { version = "0.13", features = ["blocking"] }
regex = "1.12"
